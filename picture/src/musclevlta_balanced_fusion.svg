    <text x="504" y="470" font-size="10.5" font-weight="bold" fill="#A85A08">interaction</text>
    <text class="x c" x="443" y="505">1 s history</text>
    <text class="x c" x="540" y="505">action chunk</text>
    <text class="n" x="384" y="522"><tspan font-style="italic">x</tspan><tspan dy="3" font-size="9" font-style="italic">ref</tspan><tspan dy="-3">: first valid reading of the window</tspan></text>
    <text class="n" x="384" y="537">= load (posture, payload, sensor bias)</text>
