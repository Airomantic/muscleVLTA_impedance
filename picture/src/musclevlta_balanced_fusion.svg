    <path d="M392 478.5 L402.2 477.3 L412.4 475.5 L422.6 482.4 L432.8 474 L443.1 475.8 L453.3 471 L463.5 468 L473.7 462.9 L483.9 457.8 L494.1 453.6 L504.3 450 L514.5 448.5 L524.7 450 L534.9 451.5 L545.2 453.6 L555.4 452.7 L565.6 450.3 L575.8 448.5 L586 439.2 L586 478.5 Z" fill="#F5C08C" fill-opacity="0.65"/>
    <path d="M392 478.5 H586" fill="none" stroke="#9C4A12" stroke-width="1.4" stroke-dasharray="4 2.5"/>
    <path d="M392 478.5 L402.2 477.3 L412.4 475.5 L422.6 482.4 L432.8 474 L443.1 475.8 L453.3 471 L463.5 468 L473.7 462.9 L483.9 457.8 L494.1 453.6 L504.3 450 L514.5 448.5 L524.7 450 L534.9 451.5 L545.2 453.6 L555.4 452.7 L565.6 450.3 L575.8 448.5 L586 439.2" fill="none" stroke="#E07B24" stroke-width="1.6" stroke-linejoin="round"/>
