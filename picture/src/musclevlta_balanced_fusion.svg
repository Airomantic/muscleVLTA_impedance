<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="454" height="142" viewBox="0 0 454 142" font-family="Arial, Helvetica, 'Liberation Sans', 'Nimbus Sans', sans-serif">
  <title>Balanced fusion: load-interaction decomposition of the arm force and stream-wise attention (column-width detail of musclevlta_v2_architecture.svg, panel c)</title>
  <defs>
    <style>
      .m { font-size: 13px; font-weight: bold; fill: #102A43; }
      .n { font-size: 12px; fill: #52606D; }
