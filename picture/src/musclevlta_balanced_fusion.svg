    <path class="ln" d="M536 612 H556 V603" marker-end="url(#ah)"/>
    <circle cx="556" cy="594" r="8.5" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.2"/>
    <path d="M551.5 594 h9 M556 589.5 v9" stroke="#4A5568" stroke-width="1.2"/>
    <path class="ln" d="M564.5 594 H578" marker-end="url(#ah)"/>
    <rect x="580" y="589" width="12" height="10" rx="2" fill="#7A5BC2"/>
    <text class="x c" x="586" y="583" font-style="italic">a<tspan dy="2.5" font-size="8">i</tspan></text>
